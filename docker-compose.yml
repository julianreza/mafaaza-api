services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mafaaza
      POSTGRES_PASSWORD: mafaaza
      POSTGRES_DB: mafaaza
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafaaza -d mafaaza"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mafaaza
      POSTGRES_PASSWORD: mafaaza
      POSTGRES_DB: mafaaza_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
